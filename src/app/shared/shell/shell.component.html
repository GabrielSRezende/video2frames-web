      <span class="shell__brand-mark">▮▮▯</span>
      <span class="shell__brand-name">video2frames</span>
    </div>

    <nav class="shell__nav">
      <a class="shell__nav-link" routerLink="/upload" routerLinkActive="shell__nav-link--active">
